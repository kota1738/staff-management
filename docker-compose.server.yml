# Deployment for a host that cannot run the SQL Server image.
#
# The mssql/server images are published for x86-64 only, and the home server is
# aarch64, so this variant runs the same API against SQLite on a bind mount. The
# application already supports SQLite (it is the default for local runs and the
# test suite); the code path and the schema are identical, only the engine
# differs. Use docker-compose.yml, which includes SQL Server, on an x86-64 host.
#
# Ports are loopback-only: reach the API through an SSH tunnel or a reverse
# proxy, not from the LAN.
name: staff-management

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: staff-api
    restart: unless-stopped
    environment:
      Database__Provider: Sqlite
      ConnectionStrings__Default: "Data Source=/data/staff.db"
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-admin@example.com}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./data:/data
    # The image's APP_UID is 1654; the bind mount must be owned by it, which
    # deploy.sh arranges.
    user: "1654:1654"
    mem_limit: 256m
    healthcheck:
      # The aspnet image ships neither curl nor wget, so probe the port with bash.
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 30s
      timeout: 5s
      retries: 3
